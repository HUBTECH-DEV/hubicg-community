name: Release candidate artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "1767225600"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - run: python -m pip install build
      - run: python scripts/check_p0_gates.py
      - run: python -m build
      - run: python scripts/normalize_sdist.py dist/hubicg-0.1.0.tar.gz
      - run: python scripts/verify_release.py
      - run: python scripts/build_sbom.py
      - run: python scripts/build_provenance.py
      - run: python scripts/build_checksums.py
      - run: python scripts/build_checksums.py --check
      - run: python scripts/verify_reproducible_build.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hubicg-0.1.0-release-candidate
          path: dist/
          retention-days: 30
