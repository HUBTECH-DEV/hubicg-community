name: Station Windows and Linux

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  isolated-station:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      HUBICG_STATION_ENGINE_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Engines, public artifacts and interfaces with fakes
        run: python -m pytest tests/test_station_installer.py tests/test_station_public_agents.py tests/test_station_ui_windows.py tests/test_station_ui_linux.py tests/test_station_simulator.py
