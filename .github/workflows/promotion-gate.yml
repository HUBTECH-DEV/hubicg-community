name: Public promotion gate

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Type PUBLICAR HUBICG COMMUNITY
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Verify explicit authorization
        env:
          HUBICG_AUTHORIZATION: ${{ inputs.authorization }}
        run: test "$HUBICG_AUTHORIZATION" = "PUBLICAR HUBICG COMMUNITY"
      - name: Verify P0 marks and provenance gates
        run: python scripts/check_p0_gates.py --require-closed
      - name: Verify release baseline
        run: |
          python scripts/build_manifest.py --check
          PYTHONPATH=src python -m hubicg --root . validate
          PYTHONPATH=src python -m hubicg --root . files verify
