name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "1767225600"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "${{ matrix.python }}"}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest build
      - run: python -m pip install .
      - run: python -m pytest
      - run: hubicg --root . validate
      - run: hubicg --root . files verify
      - run: python -m build
      - run: python scripts/normalize_sdist.py dist/hubicg-0.1.0.tar.gz
      - run: python scripts/verify_release.py
      - name: Candidate checksums and SBOM
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python scripts/build_sbom.py
          python scripts/build_provenance.py
          python scripts/build_checksums.py
          python scripts/build_checksums.py --check
      - name: Candidate artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hubicg-0.1.0-release-candidate
          path: dist/
          retention-days: 30
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: python -m pip install build
      - run: python scripts/verify_reproducible_build.py
  dependency-review:
    # GitHub only supports dependency review after the repository is public or
    # GitHub Advanced Security is enabled. It activates automatically at the
    # publication gate instead of weakening the check.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
